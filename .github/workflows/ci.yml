name: CI (Pull Request)

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install SolDB CLI
        run: cargo install --git https://github.com/walnuthq/soldb.git --branch feature/port-to-rust --package soldb-cli --bin soldb --locked

      - name: Check SolDB CLI commands
        run: |
          soldb --help
          soldb trace --help
          soldb simulate --help
          soldb list-events --help

      - name: Lint code
        run: npm run lint

      - name: Run tests (if available)
        run: npm test
        continue-on-error: true

      - name: Build application
        run: npm run build
